name: Validate
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    name: macOS (${{ matrix.runner }}, Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            node: '22.18.0'
            require-glass: '1'
          - runner: macos-26-intel
            node: '24'
            require-glass: '1'
          - runner: macos-15
            node: '24'
            require-glass: '0'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      ELG_REQUIRE_SUPPORTED: ${{ matrix.require-glass }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare native glass environment
        if: matrix.require-glass == '1'
        uses: ./.github/actions/prepare-glass
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm install --global npm@11.6.2
      - run: npm ci
      - run: npm audit --audit-level=low
      - run: npm run check
      - run: npm test
      - run: npm run test:native
      - run: npm run build:prebuilds
      - run: npm run test:package
      - run: git diff --exit-code
