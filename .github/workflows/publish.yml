name: Publish
# Run manually against a version tag after reviewing CI and the release checklist.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  validate:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/ci.yml
  publish:
    needs: validate
    runs-on: macos-26
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: read
      id-token: write
    env:
      ELG_REQUIRE_SUPPORTED: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Prepare native glass environment
        uses: ./.github/actions/prepare-glass
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm install --global npm@11.6.2
      - run: npm ci
      - run: npm run check:release
      - run: npm run check
      - run: npm test
      - run: npm audit --audit-level=low
      - run: npm run build:prebuilds
      - run: npm run test:package
      - run: mkdir -p artifacts && npm pack --pack-destination artifacts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-package
          path: artifacts/*.tgz
          if-no-files-found: error
      - run: npm publish artifacts/*.tgz --access public --provenance
